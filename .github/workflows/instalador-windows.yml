name: Instalador Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Gerar instalador (NSIS)
    runs-on: windows-latest
    permissions:
      contents: write # necessário só para publicar a Release numa tag v*
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes (no Windows)
        run: npm test
      - name: Compilar o app
        run: npm run build
      - name: Gerar instalador e versão portátil
        run: npx electron-builder --win --publish never
        env:
          # Sem certificado de assinatura de código (o Windows mostra o aviso do SmartScreen).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Disponibilizar para download (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Ramos-Gestao-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publicar Release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
