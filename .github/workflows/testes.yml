name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes de cálculo e cofre
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Conferir tipos (TypeScript)
        run: npm run typecheck
      - name: Testes (Vitest)
        run: npm test
      - name: Compilar o app
        run: npm run build
